<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RichIND Premium</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#08152f,#25105c,#7b176f);
color:#fff;
min-height:100vh;
}

.container{
max-width:520px;
margin:auto;
padding:20px;
}

.logo{
text-align:center;
font-size:42px;
font-weight:900;
margin:10px 0 5px;
background:linear-gradient(90deg,#39d8ff,#8c7bff,#ff54c8);
-webkit-background-clip:text;
color:transparent;
}

.subtitle{
text-align:center;
color:#cfcfe8;
margin-bottom:20px;
}

.card{
background:rgba(255,255,255,.10);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.16);
border-radius:22px;
padding:20px;
margin:15px 0;
box-shadow:0 10px 30px #0004;
}

input,button{
width:100%;
padding:14px;
margin:7px 0;
border-radius:12px;
border:0;
font-size:15px;
}

input{
background:#fff;
color:#111;
}

button{
background:linear-gradient(90deg,#247cff,#9b3cff);
color:white;
font-weight:700;
cursor:pointer;
}

.secondary{
background:#ffffff18;
border:1px solid #ffffff30;
}

.green{
background:#159957;
}

.red{
background:#e53935;
}

.price{
font-size:52px;
font-weight:900;
text-align:center;
background:linear-gradient(90deg,#ff54c8,#ffd45a,#39d8ff);
-webkit-background-clip:text;
color:transparent;
}

.hidden{
display:none!important;
}

.notice{
background:#ffcc0020;
border:1px solid #ffcc0055;
padding:13px;
border-radius:12px;
}

.pending{
background:#ff980020;
border:1px solid #ff980055;
padding:15px;
border-radius:12px;
}

.approved{
background:#20c99720;
border:1px solid #20c99755;
padding:15px;
border-radius:12px;
}

.stats{
display:flex;
gap:8px;
margin-top:15px;
}

.stat{
flex:1;
background:#0003;
padding:14px 5px;
border-radius:15px;
text-align:center;
}

.money{
font-size:20px;
font-weight:800;
}

.small{
font-size:12px;
